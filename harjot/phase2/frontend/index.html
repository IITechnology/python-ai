<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>School Portal Dashboard</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<!-- =========================================================
HEADER
========================================================= -->

<header>

    <div class="logo">

        <i class="fa-solid fa-school"></i>

        <h2>School Portal</h2>

    </div>

    <button
        id="logoutBtn"
        class="dangerBtn">

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

    </button>

</header>



<!-- =========================================================
MAIN CONTAINER
========================================================= -->

<div class="container">

    <!-- ==========================================
    WELCOME SECTION
    =========================================== -->

    <section class="welcomeSection">

        <div>

            <h1>

                Welcome,

                <span id="studentName">

                    Student

                </span>

                👋

            </h1>

            <p>

                Manage your profile, courses and student records.

            </p>

        </div>

    </section>



    <!-- ==========================================
    DASHBOARD CARDS
    =========================================== -->

    <section class="cards">

        <div class="card">

            <div class="cardIcon blue">

                <i class="fa-solid fa-users"></i>

            </div>

            <div>

                <h3>Total Students</h3>

                <p id="studentCount">

                    0

                </p>

            </div>

        </div>



        <div class="card">

            <div class="cardIcon green">

                <i class="fa-solid fa-book-open"></i>

            </div>

            <div>

                <h3>Total Courses</h3>

                <p id="courseCount">

                    0

                </p>

            </div>

        </div>

    </section>



    <!-- ==========================================
    ADD COURSE
    =========================================== -->

    <section class="section">

        <div class="sectionTitle">

            <i class="fa-solid fa-book"></i>

            <h2>

                Add Course

            </h2>

        </div>

        <form id="courseForm">

            <div class="grid">

                <div class="inputGroup">

                    <label>

                        Roll Number

                    </label>

                    <input
                        type="number"
                        id="courseRoll"
                        readonly>

                </div>

                <div class="inputGroup">

                    <label>

                        Course Title

                    </label>

                    <input
                        type="text"
                        id="course"
                        placeholder="Enter Course Name"
                        required>

                </div>

            </div>

            <button
                type="submit"
                class="primaryBtn">

                <i class="fa-solid fa-plus"></i>

                Add Course

            </button>

        </form>

    </section>

        <!-- ==========================================
    STUDENT RECORDS
    =========================================== -->

    <section class="section">

        <div class="tableHeader">

            <div class="sectionTitle">

                <i class="fa-solid fa-table"></i>

                <h2>

                    Student Records

                </h2>

            </div>

            <button
                id="refreshBtn"
                class="secondaryBtn">

                <i class="fa-solid fa-rotate"></i>

                Refresh

            </button>

        </div>

        <div class="tableContainer">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Roll</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Branch</th>

                        <th>Semester</th>

                        <th>Courses</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTableBody">

                </tbody>

            </table>

        </div>

    </section>

</div>



<!-- =========================================================
EDIT STUDENT MODAL
========================================================= -->

<div
    id="editModal"
    class="modal hidden">

    <div class="modalContent">

        <div class="modalHeader">

            <h2>

                <i class="fa-solid fa-user-pen"></i>

                Update Student

            </h2>

            <button
                id="closeModal"
                class="closeBtn">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form id="updateForm">

            <input
                type="hidden"
                id="updateRoll">

            <div class="grid">

                <div class="inputGroup">

                    <label>

                        Name

                    </label>

                    <input
                        type="text"
                        id="updateName"
                        required>

                </div>

                <div class="inputGroup">

                    <label>

                        Email

                    </label>

                    <input
                        type="email"
                        id="updateEmail"
                        required>

                </div>

                <div class="inputGroup">

                    <label>

                        Branch

                    </label>

                    <select id="updateBranch">

                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>Mechanical</option>
                        <option>Civil</option>

                    </select>

                </div>

                <div class="inputGroup">

                    <label>

                        Semester

                    </label>

                    <select id="updateSemester">

                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>

                    </select>

                </div>

            </div>

            <div class="modalButtons">

                <button
                    type="submit"
                    id="updateBtn"
                    class="primaryBtn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="dangerBtn">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>



<!-- =========================================================
EMPTY STATE
========================================================= -->

<div
    id="emptyState"
    class="emptyState hidden">

    <i class="fa-solid fa-user-graduate"></i>

    <h2>

        No Student Records Found

    </h2>

    <p>

        Students will appear here after creating an account.

    </p>

</div>



<!-- =========================================================
TOAST
========================================================= -->

<div
    id="toast"
    class="toast">

</div>



<!-- =========================================================
LOADER
========================================================= -->

<div
    id="loader"
    class="loader hidden">

    <div class="spinner"></div>

</div>



<!-- =========================================================
SCRIPTS
========================================================= -->

<script src="script.js"></script>


</body>

</html>
